name = conceptSphereTools
summary = "ConceptSphere Tools"
version = 1.0.0
author = "ConceptSphere"
description = """One global plugin that goes with the ConceptSphere AHK tools. It replaces the earlier separate minitrayQuiet, quietFocusAncestry and startMenuContextMenuFix plugins.

Quiet windows: MiniTray and ConsoleSelectAll ask for brief quiet windows through a sentinel sent via the NVDA controller client, and speech is dropped before it is synthesised, so hiding a window or copying the console buffer produces the tool's own sentence and nothing else. Any window is capped at 1.5 seconds, so a crash between open and close cannot leave NVDA mute. NVDA+Shift+M reports status and clears it.

Focus ancestry: drops the container announcements NVDA makes when focus enters a new window or document, which in a browser produces the title twice before anything useful is said. Toggle with NVDA+Shift+Q; starts enabled and the toggle is not remembered across restarts.

Start menu: stops NVDA repeating "context menu list" before every item when arrowing through a Windows 11 Start context menu, and shortens the announcement when a Start folder is expanded."""
minimumNVDAVersion = 2021.1
lastTestedNVDAVersion = 2026.1
